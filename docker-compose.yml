# docker-compose.yml
# Signal Platform — service stack
#
# Phase 1 services: postgres (TimescaleDB), redis, ingestion_binanceus,
#                   persistence_worker, api, frontend, caddy
# Phase 2 additions: bar_builder (Step 18), backtest_worker (Step 22)
#
# Run:   docker compose up -d
# Stop:  docker compose down
# Wipe:  docker compose down -v   (CAUTION: deletes database volume)

services:
  postgres:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: signal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - signal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1500M
        reservations:
          memory: 800M

  redis:
    image: redis:7.4-alpine
    container_name: signal_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --save 60 1000
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - signal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 100M

  ingestion_binanceus:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    container_name: signal_ingestion_binanceus
    restart: unless-stopped
    command: ["python", "-m", "services.ingestion_binanceus.main"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - signal_net
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 100M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ingestion_alpaca:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    container_name: signal_ingestion_alpaca
    restart: unless-stopped
    command: ["python", "-m", "services.ingestion_alpaca.main"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - signal_net
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 100M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ingestion_polygon:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    container_name: signal_ingestion_polygon
    restart: unless-stopped
    command: ["python", "-m", "services.ingestion_polygon.main"]
    env_file:
      - .env
    environment:
      # Idle by default (empty symbol list) until the operator turns it on with
      # INGESTION_POLYGON_SYMBOLS="*" (full equity universe) or a curated list.
      INGESTION_POLYGON_SYMBOLS: "${INGESTION_POLYGON_SYMBOLS:-}"
      INGESTION_POLYGON_CHANNEL: "${INGESTION_POLYGON_CHANNEL:-aggregates_sec}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - signal_net
    deploy:
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 150M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  persistence_worker:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    container_name: signal_persistence_worker
    restart: unless-stopped
    command: ["python", "-m", "services.persistence_worker.main"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - signal_net
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 150M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bar_builder:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    container_name: signal_bar_builder
    restart: unless-stopped
    command: ["python", "-m", "services.bar_builder.main"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - signal_net
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 80M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backtest_worker:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    container_name: signal_backtest_worker
    restart: unless-stopped
    command: ["python", "-m", "services.backtest_worker.main"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - signal_net
    deploy:
      resources:
        limits:
          # Backtests over long 1m histories (100k+ bars) build a per-bar
          # equity curve + materialize bars as pandas Series; 400M OOM-killed
          # such runs and stranded the job. Raised to 1G (host has 3.7G total,
          # so this is the safe ceiling alongside postgres/api). The bar-count
          # guard + window-aware loading keep multi-symbol/huge runs bounded.
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  paper_trader:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    container_name: signal_paper_trader
    restart: unless-stopped
    command: ["python", "-m", "services.paper_trader.main"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - signal_net
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 150M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Test runner — opt-in via the `test` profile, never starts on a normal `up`.
  # Run:  docker compose --profile test run --rm test
  test:
    build:
      context: .
      dockerfile: infra/docker/test.Dockerfile
    profiles: ["test"]
    env_file:
      - .env
    networks:
      - signal_net
    command: ["pytest", "-q"]

  api:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    container_name: signal_api
    restart: unless-stopped
    command: >
      gunicorn services.api.main:app
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --workers 2
      --timeout 300
      --graceful-timeout 30
      --access-logfile -
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - signal_net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 200M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend: the thebayn TanStack Start app, vendored into this repo at
  # apps/studio/. Built with bun, served as a nitro node-server. Same-origin
  # behind Caddy; the API client defaults to VITE_API_BASE=/api.
  thebayn:
    build:
      context: ./apps/studio
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: signal_thebayn
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: 0.0.0.0
      # Runtime key for the frontend's server functions (Finnhub ticker
      # validation + news wire). Interpolated from /home/signal/app/.env at
      # `docker compose up`. Only the frontend-needed key is passed here — the
      # rest of .env stays with the backend containers, not the web process.
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
    networks:
      - signal_net
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 150M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.8-alpine
    container_name: signal_caddy
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      thebayn:
        condition: service_started
    networks:
      - signal_net
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 50M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    name: signal_pgdata
  redisdata:
    name: signal_redisdata
  caddy_data:
    name: signal_caddy_data
  caddy_config:
    name: signal_caddy_config

networks:
  signal_net:
    name: signal_net
    driver: bridge
