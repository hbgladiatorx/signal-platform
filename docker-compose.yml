# docker-compose.yml
# Signal Platform — service stack
#
# Phase 1 services: postgres (TimescaleDB), redis, ingestion_binanceus,
#                   persistence_worker, api
# Later phases add: frontend, caddy
#
# Run:   docker compose up -d
# Stop:  docker compose down
# Wipe:  docker compose down -v   (CAUTION: deletes database volume)

services:
  postgres:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: signal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - signal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1500M
        reservations:
          memory: 800M

  redis:
    image: redis:7.4-alpine
    container_name: signal_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --save 60 1000
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - signal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 100M

  ingestion_binanceus:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    container_name: signal_ingestion_binanceus
    restart: unless-stopped
    command: ["python", "-m", "services.ingestion_binanceus.main"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - signal_net
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 100M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  persistence_worker:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    container_name: signal_persistence_worker
    restart: unless-stopped
    command: ["python", "-m", "services.persistence_worker.main"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - signal_net
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 150M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    container_name: signal_api
    restart: unless-stopped
    command: >
      gunicorn services.api.main:app
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --workers 2
      --access-logfile -
    env_file:
      - .env
    ports:
      # TEMPORARY — exposed to host for Step 7 testing.
      # Removed in Step 9 when Caddy becomes the only public entry.
      - "0.0.0.0:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - signal_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 200M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    name: signal_pgdata
  redisdata:
    name: signal_redisdata

networks:
  signal_net:
    name: signal_net
    driver: bridge
