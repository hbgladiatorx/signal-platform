[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-platform"
version = "0.1.0"
description = "Multi-asset quantitative research and trading platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=23.0.0",

    # Data validation and settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",

    # Cache / message bus
    "redis[hiredis]>=5.1.0",

    # Networking
    "websockets>=13.0",
    "aiohttp>=3.10.0",
    "httpx>=0.27.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",

    # Reliability
    "tenacity>=9.0.0",
    "structlog>=24.4.0",

    # Performance
    "orjson>=3.10.0",
    # Strategy framework (Step 19+): indicators, DataFrames
    "pandas>=2.2.0",
    "numpy>=1.26.0",

    # Config
    "python-dotenv>=1.0.1",
    "anthropic>=0.40.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

# This project is run via PYTHONPATH (see infra/docker/python.Dockerfile), not
# installed as an importable package. Declaring an empty module set disables
# setuptools' flat-layout auto-discovery so `pip install .` builds a
# dependencies-only distribution deterministically — whether or not the source
# tree is present on disk (it isn't, at the Docker install step).
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "SIM", "ARG"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
